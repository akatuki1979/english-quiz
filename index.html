<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>英語字幕プレーヤー</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101819;color:#edf5f1;font:16px/1.55 system-ui,sans-serif}
main{max-width:1000px;margin:auto;padding:clamp(16px,4vw,40px)}
h1{font-size:clamp(24px,5vw,38px);margin:0 0 18px;letter-spacing:-.035em}
.panel{background:#192526;border:1px solid #344546;border-radius:18px;padding:clamp(14px,3vw,24px)}
.files,.settings{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.files label{display:grid;gap:7px;min-width:0;flex:1 1 240px;font-weight:650}
input,select,button{font:inherit;color:inherit}
input[type=file]{width:100%;font-size:14px;color:#c1d2cf}
input::file-selector-button,select,input[type=number]{background:#293b3c;color:#edf5f1;border:1px solid #526766;border-radius:8px;padding:5px 8px}
input[type=number]{width:85px}
video{display:block;width:100%;height:clamp(150px,42vh,410px);background:#080d0d;border-radius:12px;color-scheme:dark}
.playback{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-top:18px}
.playback.audio-only video{height:48px}
[hidden]{display:none!important}
#tracks{display:grid;gap:16px;min-width:0}
@media(min-width:820px){#tracks{grid-auto-flow:column;grid-auto-columns:minmax(0,1fr)}}
.track h2{font-size:14px;margin:0 0 5px;color:#c1d2cf}
.caption{white-space:pre-line;overflow-wrap:anywhere;font-weight:650;font-size:clamp(17px,3vw,24px);color:#a8f4d2;text-align:center}
.caption[lang=ja]{color:#edf5f1;font-size:clamp(16px,2.6vw,21px)}
.caption + .caption{margin-top:4px}
#captions{min-height:2em}
.settings{font-size:14px}
.settings label{white-space:nowrap}
#status{font-size:14px;color:#c1d2cf;margin:10px 0 0;overflow-wrap:anywhere}
.lines{overflow:auto;height:clamp(175px,42vh,460px);border-top:1px solid #344546;overscroll-behavior:contain}
.row{display:grid;grid-template-columns:5em 1fr;text-align:left;width:100%;gap:10px;background:transparent;border:0;border-bottom:1px solid #2b393a;padding:12px 8px;cursor:pointer}
.row:hover,.row.chosen{background:#263a3a}
.row.active{background:#184d3e;color:#d2ffeb;box-shadow:inset 3px 0 #79e6b8}
.row span{white-space:pre-line;overflow-wrap:anywhere}
time{color:#a9c3be;font-size:.82em;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid #79e6b8;outline-offset:-2px}
#quiz{border-top:1px solid #344546;padding-top:16px}
#quiz h2{margin:10px 0;font-size:1.2rem}
.quiz-controls,.quiz-nav{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.quiz-controls{margin-top:16px}
.quiz-controls button,#quiz button{background:#293b3c;border:1px solid #526766;border-radius:8px;padding:7px 13px;cursor:pointer}
#quiz button:disabled{opacity:.55;cursor:default}
#quiz button.correct{background:#184d3e;border-color:#79e6b8;opacity:1}
#quiz button.incorrect{background:#573131;border-color:#f3a5a5;opacity:1}
#quiz-options{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:8px;margin:12px 0}
#quiz-options button{text-align:left}
#quiz-feedback,#quiz-position{color:#c1d2cf}
#quiz-error{color:#f5c5a8}
</style>
<main>
<h1>英語字幕プレーヤー</h1>
<div class="panel">
<div class="files">
<label>動画・音声ファイル <input id="media" type="file" accept="video/*,audio/*,.mp4,.webm,.mp3"></label>
<label>英語字幕（VTT・SRT） <input id="subtitle" type="file" accept=".vtt,.srt,text/vtt"></label>
<label>日本語字幕（任意・VTT・SRT） <input id="subtitle-ja" type="file" accept=".vtt,.srt,text/vtt"></label>
</div>

<div class="settings">
<label>速度 <select id="speed"><option value=".5">0.5×</option><option value=".75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select></label>
<label>字幕のずれ <input id="offset" type="number" value="0" step="0.1" title="正の値で字幕を遅らせます"> 秒</label>
<label><input id="follow" type="checkbox" checked> 自動スクロール</label>
<label><input id="repeat" type="checkbox"> 字幕をリピート</label>
</div>
<div class="quiz-controls">
<label>モード <select id="mode"><option value="watch">視聴</option><option value="quiz">クイズ</option></select></label>
</div>
<p id="status" role="status">同じ作品の動画（または音声）と字幕を選んでください。字幕を押すと、その位置から再生します。</p>
<div id="playback" class="playback audio-only">
<video id="player" controls playsinline preload="metadata" aria-label="動画・音声プレーヤー"></video>
<div class="settings" id="subtitle-controls" aria-label="字幕表示設定">
<label><input id="show-en" type="checkbox" checked> 英語字幕</label>
<label><input id="show-ja" type="checkbox" checked> 日本語字幕</label>
<label id="quiz-style-label" hidden>出題形式 <select id="quiz-style"><option value="listen">リスニング（解答前は字幕なし）</option><option value="read">字幕を見ながら解く</option></select></label>
<span id="subtitle-mode-hint" hidden>リスニング中は解答後に字幕を表示できます。</span>
</div>
<div id="captions">
<div class="caption" id="caption-en" lang="en" hidden></div>
<div class="caption" id="caption-ja" lang="ja" hidden></div>
</div>
<section id="quiz" hidden aria-label="リスニングクイズ">
<div class="quiz-nav">
<label>作品 <select id="quiz-work"></select></label>
<label>問題文 <select id="quiz-language"><option value="ja">日本語</option><option value="en">English</option></select></label>
<label>出題順 <select id="quiz-order"><option value="ordered">順番通り</option><option value="random">ランダム</option></select></label>
<label>問題CSV <input id="quiz-csv" type="file" accept=".csv,text/csv"></label>
<label>問題 <select id="quiz-number"></select></label>
<button id="quiz-prev" type="button">前の問題</button>
<button id="quiz-next" type="button">次の問題</button>
<span id="quiz-position"></span>
</div>
<h2 id="quiz-question"></h2>
<button id="quiz-play" type="button">この場面を再生</button>
<label id="quiz-review-label" hidden><input id="quiz-review" type="checkbox" checked> 解答後の字幕を表示</label>
<div id="quiz-options"></div>
<p id="quiz-feedback" role="status"></p>
<p id="quiz-error" role="status" hidden></p>
</section>
<div id="tracks">
<section class="track" id="track-en" hidden><h2>英語</h2><div class="lines" id="lines-en" aria-label="英語字幕一覧"></div></section>
<section class="track" id="track-ja" hidden><h2>日本語</h2><div class="lines" id="lines-ja" aria-label="日本語字幕一覧"></div></section>
</div>
</div>
</div>
</main>
<script>
'use strict';
const get = id => document.getElementById(id);
const player=get('player'), media=get('media'), speed=get('speed'), offset=get('offset'),
  follow=get('follow'), repeat=get('repeat'), status=get('status');
const tracks=['en','ja'].map(lang=>({
  lang, file:get(lang==='en'?'subtitle':'subtitle-ja'), toggle:get('show-'+lang),
  section:get('track-'+lang), caption:get('caption-'+lang), list:get('lines-'+lang),
  cues:[], buttons:[], active:[], version:0
}));
let selection=null, url='', frame=0;
const shift = () => Number(offset.value) || 0;

function seconds(value) {
  return value.replace(',', '.').split(':').reduce((time, part) => time * 60 + Number(part), 0);
}

function parseSubtitles(input) {
  const time = '(?:\\d{2,}:)?[0-5]\\d:[0-5]\\d[.,]\\d{3}';
  const timing = new RegExp('^(' + time + ')\\s+-->\\s+(' + time + ')(?:\\s.*)?$');
  const entities = {amp:'&',lt:'<',gt:'>',nbsp:' ',lrm:'\u200e',rlm:'\u200f'};
  return input.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n').split(/\n[ \t]*\n/).flatMap(block => {
    const rows = block.trim().split('\n');
    if (/^(NOTE(?:\s|$)|STYLE$|REGION$|WEBVTT(?:\s|$))/.test(rows[0])) return [];
    const index = rows.findIndex(row => timing.test(row.trim()));
    if (index < 0 || index > 1) return [];
    const [,start,end] = rows[index].trim().match(timing);
    const text = rows.slice(index+1).join('\n').replace(/<[^>]*>/g,'')
      .replace(/&(amp|lt|gt|nbsp|lrm|rlm);/g,(_,key)=>entities[key]).trim();
    const cue = {start:seconds(start),end:seconds(end),text};
    return text && cue.end > cue.start ? [cue] : [];
  }).sort((a,b)=>a.start-b.start);
}

function clock(value) {
  const whole = Math.floor(value);
  const part = n => String(n).padStart(2,'0');
  return part(Math.floor(whole/3600))+':'+part(Math.floor(whole/60)%60)+':'+part(whole%60);
}

function syncTrack(track,time) {
  const {cues,buttons,caption,list,section,toggle}=track;
  const visible=toggle.checked && cues.length>0 && subtitlesAllowed();
  section.hidden=!visible;
  const next=[];
  if(url) {
    for(let i=0;i<cues.length && cues[i].start<=time;i++) {
      if(time<cues[i].end) next.push(i);
    }
  }
  caption.hidden=!visible || next.length===0;
  if(next.length===track.active.length && next.every((i,n)=>i===track.active[n])) return;
  track.active.forEach(i=>buttons[i].classList.remove('active'));
  next.forEach(i=>buttons[i].classList.add('active'));
  track.active=next;
  caption.textContent=next.map(i=>cues[i].text).join('\n');
  if(visible && follow.checked && next.length) {
    const rect=buttons[next[0]].getBoundingClientRect();
    const pane=list.getBoundingClientRect();
    if(rect.top<pane.top+15 || rect.bottom>pane.bottom-15)
      list.scrollTop+=rect.top-pane.top-list.clientHeight/3;
  }
}

function sync() {
  get('quiz-style-label').hidden=!isQuizMode();
  get('subtitle-mode-hint').hidden=subtitlesAllowed();
  tracks.forEach(track=>syncTrack(track,player.currentTime-shift()));
  get('captions').hidden=tracks.every(track=>track.section.hidden);
}

function selectCue(track,index) {
  selection?.track.buttons[selection.index]?.classList.remove('chosen');
  selection=track ? {track,index} : null;
  selection?.track.buttons[index]?.classList.add('chosen');
}

function refresh() {
  stopAtQuizEnd();
  if(!isQuizMode() && repeat.checked && selection && !player.paused) {
    const cue=selection.track.cues[selection.index];
    const start=Math.max(0,cue.start+shift());
    const end=Math.min(player.duration,cue.end+shift());
    if(end>start && player.currentTime>=end) player.currentTime=start;
  }
  sync();
}

function animate() {
  refresh();
  frame=player.paused ? 0 : requestAnimationFrame(animate);
}

media.addEventListener('change',()=>{
  const file=media.files[0];
  if(!file) return;
  player.pause();
  quizEnd=null;
  if(url) URL.revokeObjectURL(url);
  url=URL.createObjectURL(file);
  selectCue(null);
  setVideoLayout(file.type.startsWith('video/') || /\.(mp4|webm|m4v|mov|ogv)$/i.test(file.name));
  player.src=url;
  player.playbackRate=Number(speed.value);
  status.textContent=file.name+' を選択しました。';
});
for(const track of tracks) {
track.toggle.addEventListener('change',sync);
track.file.addEventListener('change',async ()=>{
  const file=track.file.files[0];
  if(!file) return;
  const version=++track.version;
  let loaded;
  try { loaded=parseSubtitles(await file.text()); }
  catch { loaded=[]; }
  if(version!==track.version) return;
  if(selection?.track===track) selectCue(null);
  track.cues=loaded;
  track.active=[];
  track.caption.textContent='';
  track.buttons=loaded.map((cue,index)=>{
    const button=document.createElement('button');
    const time=document.createElement('time');
    const text=document.createElement('span');
    button.className='row';
    button.type='button';
    time.textContent=clock(cue.start);
    text.textContent=cue.text;
    text.lang=track.lang;
    button.append(time,text);
    button.addEventListener('click',async ()=>{
      selectCue(track,index);
      if(!url || player.readyState<1) {
        status.textContent='動画または音声を選び、読み込みが終わってから字幕を押してください。';
        return;
      }
      const start=Math.max(0,cue.start+shift());
      if(start>=player.duration || cue.end+shift()<=0) {
        status.textContent='この字幕は再生範囲外です。ファイルの組み合わせや字幕のずれを確認してください。';
        return;
      }
      player.currentTime=start;
      try { await player.play(); }
      catch { status.textContent='再生できませんでした。ファイル形式をご確認ください。'; }
    });
    return button;
  });
  track.list.replaceChildren(...track.buttons);
  track.list.scrollTop=0;
  status.textContent=loaded.length ? file.name+'（'+loaded.length+'件）' : '字幕を読み取れませんでした。VTTまたはSRTを確認してください。';
  sync();
});
}
function setVideoLayout(showVideo) {
  get('playback').classList.toggle('with-video',showVideo);
  get('playback').classList.toggle('audio-only',!showVideo);
}

player.addEventListener('loadedmetadata',()=>{setVideoLayout(player.videoWidth>0);});
player.addEventListener('playing',()=>{ if(!frame) frame=requestAnimationFrame(animate); });
player.addEventListener('pause',()=>{cancelAnimationFrame(frame);frame=0;sync();});
for(const event of ['timeupdate','seeking','loadedmetadata','ended']) player.addEventListener(event,refresh);
player.addEventListener('error',()=>{status.textContent='ファイルを読み込めませんでした。MP4・WebM・MP3など、ブラウザで再生できるファイルを選んでください。';});
speed.addEventListener('change',()=>{player.playbackRate=Number(speed.value);});
offset.addEventListener('input',sync);
repeat.addEventListener('change',()=>{
  if(repeat.checked && !selection) {
    const track=tracks.find(t=>t.toggle.checked && t.active.length);
    if(track) selectCue(track,track.active[0]);
    else status.textContent='繰り返したい字幕を押してください。';
  }

function parseQuestionCsv(source){
  const input=source.replace(/^\uFEFF/,'');
  const rows=[];
  let row=[], field='', quoted=false;
  for(let i=0;i<input.length;i++){
    const ch=input[i];
    if(quoted){
      if(ch==='"' && input[i+1]==='"'){field+='"';i++;}
      else if(ch==='"') quoted=false;
      else field+=ch;
    }else if(ch==='"' && field==='') quoted=true;
    else if(ch===','){row.push(field);field='';}
    else if(ch==='\r'||ch==='\n'){
      if(ch==='\r' && input[i+1]==='\n') i++;
      row.push(field);
      if(row.some(cell=>cell.trim())) rows.push(row);
      row=[];field='';
    }else field+=ch;
  }
  if(quoted) throw Error('引用符を閉じてください。');
  row.push(field);
  if(row.some(cell=>cell.trim())) rows.push(row);
  const headers=rows.shift()?.map(cell=>cell.trim())||[];
  const required=['問題ID','作品','問題文_日本語','問題文_英語','選択肢A','選択肢B','選択肢C','選択肢D','正解','日本語解説','開始','終了'];
  const columns=required.map(name=>headers.indexOf(name));
  if(!rows.length||columns.includes(-1)) throw Error('付属CSVと同じ列名で問題を用意してください。');
  const ids=new Set();
  const timestamp=/^\d{2,}:[0-5]\d:[0-5]\d[.,]\d{3}$/;
  return rows.map((record,i)=>{
    const cells=columns.map(index=>record[index]?.trim()||'');
    const [id,work,ja,en,a,b,c,d,key,explanation,start,end]=cells;
    if(cells.some(x=>!x)||ids.has(id)||!/^[ABCD]$/.test(key)||
      new Set([a,b,c,d]).size!==4||!timestamp.test(start)||!timestamp.test(end)||seconds(start)>=seconds(end)){
      throw Error('問題データの'+(i+1)+'行目を確認してください。');
    }
    ids.add(id);
    return {id,work,ja,en,choices:[a,b,c,d],answer:'ABCD'.indexOf(key),explanation,range:[seconds(start),seconds(end)]};
  });
}

function renderQuestion(){

  number.value=String(quizIndex);
  get('quiz-question').lang=language.value;

  const completed=quizQuestions.filter(item=>answers.has(item.id));

  get('quiz-position').textContent='解答 '+completed.length+'/'+quizQuestions.length+' ・ 正解 '+correct;
  get('quiz-prev').disabled=quizIndex===0;

  get('quiz-review-label').hidden=answer===undefined;
  get('quiz-options').replaceChildren(...q.choices.map((choice,i)=>{

    if(answer!==undefined && i===q.answer) button.classList.add('correct');

    }
  }
  number.replaceChildren(...quizQuestions.map((q,i)=>new Option(q.id,String(i))));
  changeQuestion(0);
}

function setQuestionBank(bank){
  questions=bank;
  const works=[...new Set(questions.map(q=>q.work))];
  work.replaceChildren(...works.map(name=>new Option(name,name)));
  work.value=works[0];
  answers.clear();
  changeWork();
}

language.addEventListener('change',renderQuestion);
style.addEventListener('change',sync);
order.addEventListener('change',changeWork);
let csvLoad=0;
get('quiz-csv').addEventListener('change',async event=>{
  const file=event.target.files[0];
  const version=++csvLoad;
  if(!file) return;
  try{
    const bank=parseQuestionCsv(await file.text());
    if(version===csvLoad) setQuestionBank(bank);
  }catch(error){
    if(version===csvLoad) showQuizError('CSVを読み込めませんでした。'+error.message);
  }
});
work.addEventListener('change',changeWork);
number.addEventListener('change',()=>changeQuestion(Number(number.value)));
get('quiz-prev').addEventListener('click',()=>changeQuestion(quizIndex-1));
get('quiz-next').addEventListener('click',()=>changeQuestion(quizIndex+1));
review.addEventListener('change',sync);
mode.addEventListener('change',()=>{
  player.pause();
  quizEnd=null;
  get('quiz').hidden=!isQuizMode();
  showQuizError();
  sync();
});

get('quiz-play').addEventListener('click',async()=>{
  if(!url || player.readyState<1){
    showQuizError('先に、選択した作品と同じ動画または全編MP3を読み込んでください。');
    return;
  }
  const [start,end]=currentQuestion().range;
  if(start>=player.duration || end>player.duration+0.1){
    showQuizError('この動画・音声には指定区間がありません。作品とファイルをご確認ください。');
    return;
  }
  showQuizError();
  player.currentTime=start;
  quizEnd=Math.min(end,player.duration);
  try { await player.play(); }
  catch {
    quizEnd=null;
    showQuizError('再生できませんでした。動画・音声形式をご確認ください。');
  }
});

setQuestionBank(parseQuestionCsv(builtInCsv));

</script>
